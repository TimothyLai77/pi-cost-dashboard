<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi session spend</title>
    <meta name="description" content="Ledger of what your Pi coding-agent sessions cost." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171a" />
    <!-- Vite copies web/public to the dist root, so this resolves in dev and in the image. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the stored theme before the first paint, so a reload in dark mode does not
      // flash the light palette. It mirrors web/src/theme.js and is written plainly because
      // it runs before the bundle exists.
      (function () {
        try {
          var saved = localStorage.getItem("pi-cost-theme");
          var mode =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
